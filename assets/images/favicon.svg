<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 660" role="img" aria-label="Wrad Labs mark"><style>g{fill:#1F2937}@media(prefers-color-scheme:dark){g{fill:#F9F7F3}}</style>
  <g fill="#1F2937">
    <!-- lip: a narrow collar on a thin stem — this, plus the long taper below,
         is what keeps a SOLID silhouette reading as a flask and not a pushpin -->
    <rect x="146" y="0" width="220" height="52" rx="26"/>
    <!-- thin neck flaring in one long straight taper to a wide radiused base -->
    <path d="M196 40 H316 V212 L502 400 A60 60 0 0 1 446 468 H66 A60 60 0 0 1 10 400 L196 212 Z"/>
    <!-- roots: three blunt prongs. Deliberately fat and short — at 16px the root
         band is about four pixels tall, so anything finer renders as grey haze -->
    <path d="M196 452 C176 512 180 570 202 616 C212 638 218 650 220 660 C252 634 250 586 238 546 C226 508 226 480 240 452 Z"/>
    <path d="M76 452 C68 500 44 538 12 566 C2 576 0 590 2 606 C30 588 58 566 82 538 C114 500 126 480 132 452 Z"/>
    <path d="M370 452 C382 494 404 526 438 552 C462 570 476 586 482 604 C476 576 458 552 438 532 C406 502 392 482 388 452 Z"/>
  </g>
</svg>
